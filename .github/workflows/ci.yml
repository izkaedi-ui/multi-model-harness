name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Validate configuration & test cases
        run: |
          python -m cli.main validate

      - name: Run unit & integration tests with coverage
        run: |
          python -m pytest --cov=adapters --cov=runner --cov=database --cov=security --cov=security_harness --cov-report=term-missing
